[package]
name = "rustflow"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
async-nats = { version = "0.50", features = ["jetstream"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3"
datafusion = "54.1.0"
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
csv = "1.4"
async-trait = "0.1"
object_store = { version = "0.13.2", features = ["aws"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.33"
utoipa = { version = "5.5.0", features = ["yaml"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
