[project]
name = "rustflow-python"
version = "0.1.0"
description = "Python client, validation tools, and load tests for RustFlow"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "polars>=1.30,<2",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "locust>=2.35,<3",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running RustFlow Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/rustflow_client"]
